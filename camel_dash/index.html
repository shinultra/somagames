<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camel Pyramid Run</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="score-board">Time: <span id="time-display">60</span>s</div>
            <div id="start-screen" class="overlay">
                <h1>Camel Pyramid Run</h1>
                <p>Avoid Pyramids! Surviving 60 seconds!</p>
                <p>Use Arrow Keys or Touch/Drag to Move</p>
                <button id="start-btn">Start Game</button>
            </div>
            <div id="game-over-screen" class="overlay hidden">
                <h1>Game Over</h1>
                <p>You hit a pyramid!</p>
                <button id="restart-btn-fail">Try Again</button>
            </div>
            <div id="win-screen" class="overlay hidden">
                <h1>You Win!</h1>
                <p>You survived the desert!</p>
                <button id="restart-btn-win">Play Again</button>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
