<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camel Pyramid Run</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="score-board">残り時間: <span id="time-display">60</span>秒</div>
            <div id="start-screen" class="overlay">
                <h1>キャメル・ダッシュ</h1>
                <p>ピラミッドを避けて、60秒間生き残れ！</p>
                <p>矢印キー または スワイプで操作</p>
                <button id="start-btn">ゲームスタート</button>
            </div>
            <div id="game-over-screen" class="overlay hidden">
                <h1>ゲームオーバー</h1>
                <p>ピラミッドにぶつかってしまった！</p>
                <button id="restart-btn-fail">もう一度 (Enter)</button>
            </div>
            <div id="win-screen" class="overlay hidden">
                <h1>クリア！</h1>
                <p>砂漠を駆け抜けた！</p>
                <button id="restart-btn-win">もう一度 (Enter)</button>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
